version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      compatible: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      compatible: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
