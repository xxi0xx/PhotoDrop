version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      compatible: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      # @typescript/native already checks with TS7; typescript is Svelte's TS6 companion.
      - dependency-name: typescript
        versions: ['>=7.0.0 <8.0.0']
    groups:
      compatible: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      # Node 25 never enters LTS. Keep 24.x and future LTS upgrades visible.
      - dependency-name: node
        versions: ['~> 25.0']
