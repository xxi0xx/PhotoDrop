services:
  photodrop:
    build: .
    ports:
      - "8080:8080"
    environment:
      PHOTODROP_LISTEN_ADDR: ":8080"
      PHOTODROP_DATA_DIR: /data
      PHOTODROP_BASE_URL: "${PHOTODROP_BASE_URL:-}"
      PHOTODROP_ADMIN_PASSWORD: "${PHOTODROP_ADMIN_PASSWORD:?Set PHOTODROP_ADMIN_PASSWORD to a strong 12-to-72-byte password}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 15s
