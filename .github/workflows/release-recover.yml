name: Recover release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to recover (for example v1.0.0)
        required: true
        type: string
      expected_digest:
        description: Confirm the already-published immutable OCI index sha256 digest
        required: true
        type: string

permissions:
  contents: read

# Serialize normal publication and recovery in this repository.
concurrency:
  group: photodrop-release
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate remote tag, ancestry, license and existing immutable artifact
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: node scripts/release-recover.mjs prepare "$TAG" "$EXPECTED_DIGEST" "$RUNNER_TEMP/recovery.json"
      - name: Verify published artifacts and both child-digest runtimes
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.plan.outputs.digest }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG_COMMIT: ${{ steps.plan.outputs.commit }}
        run: node scripts/verify-published.mjs "$IMAGE" "$DIGEST" "$VERSION" "$TAG_COMMIT"
      - name: Complete publication without replacing conflicting state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-recover.mjs finish "$RUNNER_TEMP/recovery.json"
