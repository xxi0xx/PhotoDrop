services:
  photodrop:
    build: .
    ports:
      - "8080:8080"
    environment:
      PHOTODROP_LISTEN_ADDR: ":8080"
      PHOTODROP_DATA_DIR: /data
      PHOTODROP_BASE_URL: "${PHOTODROP_BASE_URL:-}"
      PHOTODROP_ADMIN_PASSWORD: "${PHOTODROP_ADMIN_PASSWORD:?Set PHOTODROP_ADMIN_PASSWORD to a strong 12-to-72-byte password}"
      PHOTODROP_MAX_FILE_SIZE: "${PHOTODROP_MAX_FILE_SIZE:-52428800}"
      PHOTODROP_UPLOAD_SESSION_TTL: "${PHOTODROP_UPLOAD_SESSION_TTL:-2h}"
      PHOTODROP_UPLOAD_SESSION_MAX_ASSETS: "${PHOTODROP_UPLOAD_SESSION_MAX_ASSETS:-100}"
      PHOTODROP_UPLOAD_SESSION_MAX_BYTES: "${PHOTODROP_UPLOAD_SESSION_MAX_BYTES:-5368709120}"
      PHOTODROP_TURNSTILE_SITE_KEY: "${PHOTODROP_TURNSTILE_SITE_KEY:-}"
      PHOTODROP_TURNSTILE_SECRET_KEY: "${PHOTODROP_TURNSTILE_SECRET_KEY:-}"
      PHOTODROP_TRUSTED_PROXY_CIDRS: "${PHOTODROP_TRUSTED_PROXY_CIDRS:-}"
      PHOTODROP_RATE_LIMIT_MULTIPLIER: "${PHOTODROP_RATE_LIMIT_MULTIPLIER:-1}"
      PHOTODROP_RATE_LIMIT_DISABLED: "${PHOTODROP_RATE_LIMIT_DISABLED:-false}"
      PHOTODROP_STORAGE_PROVIDER: "${PHOTODROP_STORAGE_PROVIDER:-local}"
      PHOTODROP_STORAGE_BACKEND_KEY: "${PHOTODROP_STORAGE_BACKEND_KEY:-}"
      PHOTODROP_S3_BUCKET: "${PHOTODROP_S3_BUCKET:-}"
      PHOTODROP_S3_REGION: "${PHOTODROP_S3_REGION:-auto}"
      PHOTODROP_S3_ENDPOINT: "${PHOTODROP_S3_ENDPOINT:-}"
      PHOTODROP_S3_ACCESS_KEY_ID: "${PHOTODROP_S3_ACCESS_KEY_ID:-}"
      PHOTODROP_S3_SECRET_ACCESS_KEY: "${PHOTODROP_S3_SECRET_ACCESS_KEY:-}"
      PHOTODROP_S3_SESSION_TOKEN: "${PHOTODROP_S3_SESSION_TOKEN:-}"
      PHOTODROP_S3_PATH_STYLE: "${PHOTODROP_S3_PATH_STYLE:-false}"
      PHOTODROP_S3_PREFIX: "${PHOTODROP_S3_PREFIX-photodrop/}"
      PHOTODROP_S3_PRESIGN_TTL: "${PHOTODROP_S3_PRESIGN_TTL:-10m}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 15s
