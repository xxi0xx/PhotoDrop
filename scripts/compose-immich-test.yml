# Test-only real Immich. Never included by the production compose.yml.
# API/Compose contract pinned to immich-app/immich v3.4.2 (database and Valkey
# images copied from that tag's docker/docker-compose.yml).
name: photodrop-immich-test
services:
  objects:
    image: photodrop:immich-build
    build:
      context: ..
      target: backend
    command: [sh, -ec, 'go build -o /tmp/immichtest ./scripts/immichtest && exec /tmp/immichtest']
    ports:
      - 127.0.0.1:8083:8083
      - 127.0.0.1:18092:18092
      - 127.0.0.1:18093:18093
      - 127.0.0.1:2284:2284
      # Immich and the test identity provider share this network namespace, so
      # PhotoDrop, Immich and the test runner all use the same loopback URLs.
      - 127.0.0.1:22830:2283
      - 127.0.0.1:18997:18997
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:18092/__test/requests && wget -q -O /dev/null http://localhost:2284/__test/control && wget -q -O /dev/null http://localhost:18997/__test/oidc']
      interval: 2s
      timeout: 2s
      retries: 60
  photodrop:
    image: photodrop:immich-test
    build:
      context: ..
    network_mode: service:objects
    # Test-only: writes the disposable per-run secrets key with production
    # ownership (10001) and mode (400), then runs the normal entrypoint.
    # Production images and Compose files never do this.
    entrypoint:
      - sh
      - -ec
      - |
        if [ -n "$${PHOTODROP_TEST_SECRETS_KEY:-}" ]; then
          mkdir -p /run/photodrop-test
          printf %s "$$PHOTODROP_TEST_SECRETS_KEY" > /run/photodrop-test/secrets-key
          chown 10001:10001 /run/photodrop-test/secrets-key
          chmod 400 /run/photodrop-test/secrets-key
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: [/usr/local/bin/photodrop]
    depends_on:
      objects:
        condition: service_healthy
      immich-server:
        condition: service_healthy
    environment:
      PHOTODROP_LISTEN_ADDR: :8083
      PHOTODROP_DATA_DIR: /data
      PHOTODROP_BASE_URL: http://localhost:8083
      PHOTODROP_ADMIN_PASSWORD: temporary-immich-test-admin-password
      PHOTODROP_ADMIN_AUTH: password+oidc
      PHOTODROP_OIDC_ISSUER: http://localhost:18997/application/o/drop/
      PHOTODROP_OIDC_CLIENT_ID: photodrop-test
      PHOTODROP_OIDC_CLIENT_SECRET: disposable-oidc-client-secret
      PHOTODROP_OIDC_ALLOWED_GROUPS: photodrop-admins
      PHOTODROP_OIDC_HOST_GROUPS: photodrop-hosts
      PHOTODROP_TEST_SECRETS_KEY: '${PHOTODROP_TEST_SECRETS_KEY:-}'
      PHOTODROP_SECRETS_KEY_FILE: '${PHOTODROP_TEST_SECRETS_KEY:+/run/photodrop-test/secrets-key}'
      PHOTODROP_STORAGE_PROVIDER: '${PHOTODROP_TEST_PROVIDER:-local}'
      PHOTODROP_STORAGE_BACKEND_KEY: '${PHOTODROP_TEST_BACKEND_KEY:-}'
      PHOTODROP_S3_BACKENDS: s3-a,s3-b
      PHOTODROP_S3_S3_A_BUCKET: photos-a
      PHOTODROP_S3_S3_A_ENDPOINT: http://localhost:18092
      PHOTODROP_S3_S3_A_PATH_STYLE: 'true'
      PHOTODROP_S3_S3_A_ACCESS_KEY_ID: test-s3-access
      PHOTODROP_S3_S3_A_SECRET_ACCESS_KEY: test-s3-secret-for-local-tests-only
      PHOTODROP_S3_S3_B_BUCKET: photos-b
      PHOTODROP_S3_S3_B_ENDPOINT: http://localhost:18093
      PHOTODROP_S3_S3_B_PATH_STYLE: 'true'
      PHOTODROP_S3_S3_B_ACCESS_KEY_ID: test-s3-access
      PHOTODROP_S3_S3_B_SECRET_ACCESS_KEY: test-s3-secret-for-local-tests-only
      PHOTODROP_IMMICH_TARGET: integration-test
      PHOTODROP_IMMICH_INTEGRATION_TEST_URL: http://localhost:2284
      PHOTODROP_IMMICH_INTEGRATION_TEST_PUBLIC_URL: http://localhost:22830
      PHOTODROP_IMMICH_INTEGRATION_TEST_API_KEY: '${PHOTODROP_TEST_IMMICH_KEY:-}'
    volumes:
      - photodrop-data:/data
      - export-data:/export
    stop_grace_period: 15s
    healthcheck:
      interval: 2s
      timeout: 5s
      start_period: 2s
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: temporary-immich-test-database-password
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_CONFIG_FILE: /test-config.json
    network_mode: service:objects
    volumes:
      - immich-media:/data
      - ./immich-test-config.json:/test-config.json:ro
    depends_on:
      objects:
        condition: service_started
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: false
      interval: 5s
      timeout: 5s
      retries: 60
  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: temporary-immich-test-database-password
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich-database:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d immich]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  photodrop-data:
  export-data:
  immich-media:
  immich-database:
